<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete OS</title>
<style>
  :root { --ink:#10171A; --soft:#57646A; --paper:#F2F4F3; --accent:#C23A1F; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink:#E7ECED; --soft:#8B969B; --paper:#0B0E10; --accent:#E14526; }
  }
  body { margin:0; background:var(--paper); color:var(--ink); display:grid; place-items:center;
         min-height:100vh; padding:16px;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:30rem; }
  h1 { font-size:1.6rem; margin:0 0 .6rem; letter-spacing:-.01em; }
  p { color:var(--soft); margin:0 0 1.4rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Athlete OS</h1>
  <p>Aplikacja do zapisywania wyników standaryzowanej baterii testów sprawnościowych. W przygotowaniu.</p>
  <p><strong>Kontakt i pomoc:</strong> <a href="mailto:kontakt@athleteos.pl">kontakt@athleteos.pl</a></p>
  <p lang="en">Support: <a href="mailto:kontakt@athleteos.pl">kontakt@athleteos.pl</a>. Questions about the app, a result or your data — write and you will get an answer.</p>
  <p><a href="./privacy/">Polityka prywatności</a></p>
</main>
</body>
</html>
